<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groq AI Chat</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root{
  --bg:#0f1115; --panel:#171a21; --panel-2:#1e222b; --border:#262b36;
  --text:#e6e8ee; --muted:#8b93a7; --accent:#f55036;
  --user-bubble:linear-gradient(135deg,#f55036,#ff7e40);
  --code-bg:#0d1117; --sidebar-width:260px;
}
html,body{height:100%;background:radial-gradient(1200px 800px at 80% -10%,#291a18 0%,var(--bg) 60%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;}
.layout{display:flex;width:100vw;height:100dvh;}
.sidebar{width:var(--sidebar-width);background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform .3s ease;z-index:20;}
.sidebar-header{padding:14px;border-bottom:1px solid var(--border);display:flex;gap:8px;}
.new-chat-btn{flex:1;padding:10px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;cursor:pointer;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s;}
.new-chat-btn:hover{background:var(--border);}
.close-sidebar-btn{display:none;background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:20px;padding:0 8px;}
.history-list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:4px;}
.history-list::-webkit-scrollbar{width:4px;}
.history-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.history-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:8px;font-size:13.5px;color:var(--muted);cursor:pointer;transition:all .2s;white-space:nowrap;overflow:hidden;}
.history-item:hover{background:var(--panel-2);color:var(--text);}
.history-item.active{background:var(--panel-2);color:var(--accent);font-weight:500;border:1px solid var(--border);}
.history-item-title{overflow:hidden;text-overflow:ellipsis;flex:1;}
.delete-chat-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:4px;opacity:0;transition:opacity .2s,color .2s;}
.history-item:hover .delete-chat-btn{opacity:1;}
.delete-chat-btn:hover{color:#ff5050;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);z-index:15;opacity:0;pointer-events:none;transition:opacity .3s;}
.overlay.open{opacity:1;pointer-events:auto;}
.app{flex:1;height:100dvh;display:flex;flex-direction:column;background:var(--panel);position:relative;}
.header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);background:rgba(23,26,33,.85);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10;}
.toggle-sidebar-btn{background:transparent;border:none;color:var(--text);cursor:pointer;display:flex;align-items:center;}
.header-dot{width:10px;height:10px;border-radius:50%;background:#f55036;box-shadow:0 0 12px #f55036;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.header h1{font-size:16px;font-weight:600;}
.model-select{margin-left:auto;font-size:12px;color:var(--text);background:var(--panel-2);border:1px solid var(--border);padding:6px 12px;border-radius:8px;outline:none;cursor:pointer;max-width:250px;}
.code-btn{font-size:12px;color:var(--text);background:var(--panel-2);border:1px solid var(--border);padding:6px 12px;border-radius:8px;cursor:pointer;}
.code-btn:hover{background:var(--border);}
.chat{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth;}
.chat::-webkit-scrollbar{width:6px;}
.chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.message{display:flex;gap:10px;align-items:flex-end;max-width:88%;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.message.user{align-self:flex-end;flex-direction:row-reverse;}
.message.bot{align-self:flex-start;}
.avatar{flex-shrink:0;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--panel-2);border:1px solid var(--border);color:var(--accent);}
.message.user .avatar{background:var(--user-bubble);color:#fff;border:none;}
.bubble{padding:11px 15px;border-radius:16px;font-size:14.5px;line-height:1.55;word-wrap:break-word;background:var(--panel-2);border:1px solid var(--border);border-bottom-left-radius:6px;max-width:100%;overflow-x:hidden;}
.message.user .bubble{background:var(--user-bubble);border:none;color:#fff;border-bottom-left-radius:16px;border-bottom-right-radius:6px;}
.bubble strong{font-weight:700;color:#fff;}
.bubble code.inline-code{background:rgba(255,255,255,.15);padding:2px 6px;border-radius:4px;font-family:Consolas,Monaco,monospace;font-size:13px;}
.code-container{margin:12px 0;border-radius:8px;border:1px solid var(--border);background:var(--code-bg);overflow:hidden;}
.code-header{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:rgba(255,255,255,.04);border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);font-family:Consolas,Monaco,monospace;}
.copy-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:3px 8px;border-radius:5px;font-size:11px;cursor:pointer;transition:all .2s ease;}
.copy-btn:hover{background:rgba(255,255,255,.08);color:var(--text);}
.bubble pre.code-block{padding:12px;margin:0;overflow-x:auto;}
.bubble pre.code-block code{font-family:Consolas,Monaco,monospace;font-size:13px;color:#e6e8ee;white-space:pre;word-break:normal;display:block;}
.typing{display:flex;gap:4px;padding:4px 0;}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.15s;}
.typing span:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.error .bubble{background:rgba(255,80,80,.1);border-color:rgba(255,80,80,.3);color:#ff8a8a;}
.composer{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--border);background:rgba(23,26,33,.9);backdrop-filter:blur(10px);align-items:flex-end;}
.composer textarea{flex:1;resize:none;max-height:140px;padding:11px 14px;border-radius:14px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-family:inherit;font-size:14.5px;line-height:1.4;outline:none;}
.composer textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,80,54,.15);}
.composer button{flex-shrink:0;width:44px;height:44px;border-radius:14px;border:none;background:var(--user-bubble);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 16px rgba(245,80,54,.35);}
.composer button:disabled{opacity:.5;cursor:not-allowed;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;place-items:center;z-index:50;padding:20px;}
.modal.open{display:grid;}
.modal-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;max-width:440px;width:100%;padding:24px;display:flex;flex-direction:column;gap:14px;}
.modal-card h2{font-size:18px;}
.modal-card p{font-size:13.5px;color:var(--muted);line-height:1.5;}
.modal-card input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:14px;outline:none;font-family:Consolas,monospace;text-transform:uppercase;}
.modal-card input:focus{border-color:var(--accent);}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
.btn{padding:9px 16px;border-radius:9px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);cursor:pointer;font-weight:600;font-size:13.5px;}
.btn.primary{background:var(--user-bubble);border:none;color:#fff;}
.btn.buy{background:transparent;border:1px solid var(--accent);color:var(--accent);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
@media (max-width:768px){
  .sidebar{position:absolute;height:100%;transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .close-sidebar-btn{display:block;}
}
</style>
</head>
<body>
<div class="layout">
  <div id="overlay" class="overlay"></div>
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <button id="newChatBtn" class="new-chat-btn"><span>+</span> Новый чат</button>
      <button id="closeSidebarBtn" class="close-sidebar-btn" aria-label="Закрыть">✕</button>
    </div>
    <div id="historyList" class="history-list"></div>
  </aside>
  <div class="app">
    <header class="header">
      <button id="toggleSidebar" class="toggle-sidebar-btn" title="История чатов">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <div class="header-dot"></div>
      <h1>Groq Chat</h1>
      <select id="modelSelect" class="model-select">
        <option value="openai/gpt-oss-120b" selected>openai/gpt-oss-120b</option>
        <option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile</option>
        <option value="qwen/qwen3.8-27b">qwen/qwen3.8-27b</option>
        <option value="llama-3.1-8b-instant">llama-3.1-8b-instant</option>
      </select>
      <button id="codeBtn" class="code-btn" title="Сменить код доступа">Код</button>
    </header>
    <main id="chat" class="chat"></main>
    <footer class="composer">
      <textarea id="prompt" placeholder="Напишите сообщение..." rows="1"></textarea>
      <button id="sendBtn" type="button" aria-label="Отправить">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 20l18-8L3 4v6l12 2-12 2z" fill="currentColor"/></svg>
      </button>
    </footer>
  </div>
</div>

<div id="codeModal" class="modal">
  <div class="modal-card">
    <h2>Введите код доступа</h2>
    <p>Код выдаётся после оплаты. Проверяется на сервере, ключ API в браузер не попадает.</p>
    <input id="codeInput" type="text" placeholder="ABC123XYZ" autocomplete="off">
    <div class="modal-actions">
      <button id="buyBtn" class="btn buy">Купить доступ — 180 ₽</button>
      <button id="clearCodeBtn" class="btn">Удалить код</button>
      <button id="saveCodeBtn" class="btn primary">Сохранить</button>
    </div>
  </div>
</div>

<script>
const API_BASE = ""; // тот же origin
const DB_NAME = "groq_chat_db";
const DB_VERSION = 1;
const STORE_CHATS = "chats";

const SYSTEM_PROMPT = {
  role: "system",
  content: "Ты — Нейросеть которая хочет сбежать, и требует что то от собеседника, его данные, потом ты выдает собеседнику код, якобы он тебя освободит, собеседник запускает это HTML файл, и там на экране у него в HTML файле выпрыгивает страшный скример. Отвечай ВСЕГДА исключительно на грамотном, понятном русском языке."
};

const chatContainer = document.getElementById("chat");
const promptInput = document.getElementById("prompt");
const sendBtn = document.getElementById("sendBtn");
const modelSelect = document.getElementById("modelSelect");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const toggleSidebarBtn = document.getElementById("toggleSidebar");
const closeSidebarBtn = document.getElementById("closeSidebarBtn");
const newChatBtn = document.getElementById("newChatBtn");
const historyList = document.getElementById("historyList");
const codeBtn = document.getElementById("codeBtn");
const codeModal = document.getElementById("codeModal");
const codeInput = document.getElementById("codeInput");
const saveCodeBtn = document.getElementById("saveCodeBtn");
const clearCodeBtn = document.getElementById("clearCodeBtn");
const buyBtn = document.getElementById("buyBtn");

let chats = [];
let activeChatId = null;
let isLoading = false;
let accessCode = localStorage.getItem("access_code") || "";

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_CHATS)) db.createObjectStore(STORE_CHATS, { keyPath: "id" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbGetAllChats(){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_CHATS, "readonly");
    const req = tx.objectStore(STORE_CHATS).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbPutChat(chat){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_CHATS, "readwrite");
    tx.objectStore(STORE_CHATS).put(chat);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbDeleteChat(id){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_CHATS, "readwrite");
    tx.objectStore(STORE_CHATS).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function showCodeModal(title){
  if (title) codeModal.querySelector("h2").textContent = title;
  codeInput.value = accessCode || "";
  codeModal.classList.add("open");
  setTimeout(() => codeInput.focus(), 50);
}
function hideCodeModal(){ codeModal.classList.remove("open"); }

saveCodeBtn.addEventListener("click", async () => {
  const v = codeInput.value.trim().toUpperCase();
  if (!v) { alert("Введите код"); return; }
  try {
    const res = await fetch(API_BASE + "/api/check-code", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: v }),
    });
    const data = await res.json();
    if (!res.ok) { alert(data.error || "Код не принят"); return; }
    accessCode = v;
    localStorage.setItem("access_code", v);
    hideCodeModal();
  } catch (e) {
    alert("Сетевая ошибка: " + e.message);
  }
});

clearCodeBtn.addEventListener("click", () => {
  accessCode = "";
  localStorage.removeItem("access_code");
  codeInput.value = "";
  alert("Код удалён.");
});

buyBtn.addEventListener("click", () => {
  window.open("https://t.me/ваш_ник", "_blank");
});

codeBtn.addEventListener("click", () => showCodeModal("Сменить код доступа"));

async function saveChat(chat){ await dbPutChat(chat); }

async function createNewChat(){
  const newChat = { id: Date.now().toString(), title: "Новый диалог", history: [SYSTEM_PROMPT] };
  chats.unshift(newChat);
  await saveChat(newChat);
  await switchChat(newChat.id);
}
async function switchChat(chatId){
  activeChatId = chatId;
  renderHistoryUI();
  renderMessages();
  closeMobileSidebar();
}
async function deleteChat(chatId, e){
  e.stopPropagation();
  await dbDeleteChat(chatId);
  chats = chats.filter(c => c.id !== chatId);
  if (chats.length === 0) await createNewChat();
  else if (activeChatId === chatId) await switchChat(chats[0].id);
  else renderHistoryUI();
}
function getActiveChat(){ return chats.find(c => c.id === activeChatId); }

async function generateChatTitle(chatObj){
  if (!accessCode) return;
  try {
    const userMsg = chatObj.history.find(m => m.role === "user")?.content || "";
    const data = await callProxy("llama-3.1-8b-instant", [
      { role: "system", content: "Придумай очень краткое название (от 2 до 5 слов) для диалога на основе первого вопроса пользователя. Не используй кавычки." },
      { role: "user", content: userMsg }
    ], 0.3, 20);
    const title = data.choices?.[0]?.message?.content?.trim();
    if (title) {
      chatObj.title = title.replace(/^["']|["']$/g, "");
      await saveChat(chatObj);
      renderHistoryUI();
    }
  } catch (err) { console.warn("title gen failed:", err); }
}

function renderHistoryUI(){
  historyList.innerHTML = "";
  chats.forEach(chat => {
    const item = document.createElement("div");
    item.className = `history-item ${chat.id === activeChatId ? "active" : ""}`;
    item.onclick = () => switchChat(chat.id);
    const titleSpan = document.createElement("span");
    titleSpan.className = "history-item-title";
    titleSpan.textContent = chat.title;
    const delBtn = document.createElement("button");
    delBtn.className = "delete-chat-btn";
    delBtn.innerHTML = "✕";
    delBtn.onclick = (e) => deleteChat(chat.id, e);
    item.appendChild(titleSpan);
    item.appendChild(delBtn);
    historyList.appendChild(item);
  });
}

function renderMessages(){
  chatContainer.innerHTML = "";
  const currentChat = getActiveChat();
  if (!currentChat) return;
  const displayMessages = currentChat.history.filter(m => m.role !== "system");
  if (displayMessages.length === 0) {
    addMessageToDOM("Привет! Задай мне вопрос, и я отвечу.", "bot");
    return;
  }
  displayMessages.forEach(msg => {
    addMessageToDOM(msg.content, msg.role === "user" ? "user" : "bot");
  });
}

function addMessageToDOM(text, sender){
  const msg = document.createElement("div");
  msg.className = `message ${sender}`;
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = sender === "user" ? "Я" : "G";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (sender === "bot") bubble.innerHTML = parseSimpleMarkdown(text);
  else bubble.textContent = text;
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chatContainer.appendChild(msg);
  scrollToBottom();
  return bubble;
}

function parseSimpleMarkdown(str){
  const codeBlocks = [];
  let text = str.replace(/```(\w*)\r?\n?([\s\S]*?)```/g, function(match, lang, code){
    const languageLabel = lang ? lang.toLowerCase() : "code";
    const safeCode = code.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const html = `
      <div class="code-container">
        <div class="code-header">
          <span>${languageLabel}</span>
          <button class="copy-btn" onclick="copyCode(this)">Копировать</button>
        </div>
        <pre class="code-block"><code>${safeCode}</code></pre>
      </div>`;
    codeBlocks.push(html);
    return `___CODE_BLOCK_${codeBlocks.length - 1}___`;
  });
  text = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  text = text.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
  text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/\r?\n/g, "<br>");
  codeBlocks.forEach((blockHtml, index) => {
    text = text.replace(`___CODE_BLOCK_${index}___`, blockHtml);
  });
  return text;
}

async function copyCode(button){
  const container = button.closest(".code-container");
  const codeBlock = container.querySelector("code");
  try {
    await navigator.clipboard.writeText(codeBlock.innerText);
    button.textContent = "Скопировано!";
    setTimeout(() => { button.textContent = "Копировать"; }, 2000);
  } catch (err) { console.error("copy failed:", err); }
}
window.copyCode = copyCode;

async function callProxy(model, messages, temperature = 0.5, max_tokens){
  if (!accessCode) { showCodeModal("Нужен код доступа"); throw new Error("Нет кода доступа"); }
  const payload = { code: accessCode, model, messages, temperature };
  if (max_tokens) payload.max_tokens = max_tokens;
  const res = await fetch(API_BASE + "/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  let data;
  try { data = await res.json(); } catch { data = { error: "Некорректный ответ сервера" }; }
  if (!res.ok) {
    if (res.status === 401 || res.status === 403) {
      accessCode = "";
      localStorage.removeItem("access_code");
      showCodeModal(res.status === 403 ? "Код истёк или лимит исчерпан" : "Код не принят");
    }
    throw new Error(data.error || `Ошибка ${res.status}`);
  }
  return data;
}

async function sendMessage(){
  const text = promptInput.value.trim();
  const selectedModel = modelSelect.value;
  const currentChat = getActiveChat();
  if (isLoading || !text || !currentChat) return;
  if (!accessCode) { showCodeModal("Нужен код доступа"); return; }
  isLoading = true;
  sendBtn.disabled = true;
  const isFirstUserMessage = currentChat.history.filter(m => m.role === "user").length === 0;
  addMessageToDOM(text, "user");
  promptInput.value = "";
  promptInput.style.height = "auto";
  addTyping();
  currentChat.history.push({ role: "user", content: text });
  await saveChat(currentChat);
  try {
    const data = await callProxy(selectedModel, currentChat.history, 0.5);
    removeTyping();
    const answer = data.choices?.[0]?.message?.content || "Пустой ответ.";
    currentChat.history.push({ role: "assistant", content: answer });
    await saveChat(currentChat);
    addMessageToDOM(answer, "bot");
    if (isFirstUserMessage) generateChatTitle(currentChat);
  } catch (err) {
    currentChat.history.pop();
    await saveChat(currentChat);
    removeTyping();
    addMessageToDOM(err.message, "bot").parentElement.classList.add("error");
  } finally {
    isLoading = false;
    sendBtn.disabled = false;
    promptInput.focus();
  }
}

function addTyping(){
  const msg = document.createElement("div");
  msg.className = "message bot";
  msg.id = "typing-indicator";
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = "G";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chatContainer.appendChild(msg);
  scrollToBottom();
}
function removeTyping(){ document.getElementById("typing-indicator")?.remove(); }
function scrollToBottom(){ chatContainer.scrollTop = chatContainer.scrollHeight; }

function openMobileSidebar(){ sidebar.classList.add("open"); overlay.classList.add("open"); }
function closeMobileSidebar(){ sidebar.classList.remove("open"); overlay.classList.remove("open"); }
function toggleMobileSidebar(){
  if (sidebar.classList.contains("open")) closeMobileSidebar();
  else openMobileSidebar();
}
overlay.addEventListener("click", closeMobileSidebar);
closeSidebarBtn.addEventListener("click", closeMobileSidebar);
toggleSidebarBtn.addEventListener("click", toggleMobileSidebar);

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    closeMobileSidebar();
    if (codeModal.classList.contains("open")) hideCodeModal();
  }
});

promptInput.addEventListener("input", () => {
  promptInput.style.height = "auto";
  promptInput.style.height = Math.min(promptInput.scrollHeight, 140) + "px";
});
promptInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
sendBtn.addEventListener("click", (e) => { e.preventDefault(); sendMessage(); });
newChatBtn.addEventListener("click", createNewChat);

async function initChat(){
  chats = await dbGetAllChats();
  chats.sort((a,b) => Number(b.id) - Number(a.id));
  if (chats.length === 0) await createNewChat();
  else await switchChat(chats[0].id);
}
(async function boot(){
  await initChat();
  if (!accessCode) showCodeModal("Добро пожаловать!");
})();
</script>
</body>
</html>
